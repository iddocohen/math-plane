<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mathe-Flieger Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#24324a; --gold:#ffd23f; --btn:#2f7fd1; }
  html,body { margin:0; height:100%; background:#1d2b44; overflow:hidden; font-family:'Fredoka','Trebuchet MS',sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  #stage { position:absolute; width:1024px; height:700px; transform-origin:0 0; }
  canvas { position:absolute; left:0; top:0; width:1024px; height:700px; }
  button { font-family:inherit; cursor:pointer; border:0; }
  #top { position:absolute; left:0; right:0; top:0; height:64px; display:flex; align-items:center; gap:12px; padding:0 14px; box-sizing:border-box; }
  #home { background:#ffffffd9; border-radius:14px; padding:8px 14px; font-size:18px; color:var(--ink); }
  #banner { flex:1; text-align:center; font-size:28px; font-weight:600; color:#fff; text-shadow:0 2px 0 #0005; }
  #stars { background:#ffffffd9; border-radius:14px; padding:8px 14px; font-size:20px; font-weight:600; }
  #help { width:46px; height:46px; border-radius:50%; background:var(--gold); font-size:26px; font-weight:600; color:var(--ink); box-shadow:0 3px 0 #b8901a; }
  #bottom { position:absolute; left:0; right:0; bottom:14px; display:flex; justify-content:center; gap:10px; }
  #digits { display:flex; gap:8px; }
  #digits button { width:56px; height:56px; border-radius:14px; background:#fff; font-size:28px; font-weight:600; color:var(--ink); box-shadow:0 3px 0 #0003; }
  #done { height:56px; padding:0 26px; border-radius:14px; background:#3fa34d; color:#fff; font-size:24px; font-weight:600; box-shadow:0 3px 0 #2a7434; }
  #toast { position:absolute; left:50%; top:76px; transform:translateX(-50%); background:#fffffff2; border-radius:16px; padding:10px 20px; font-size:22px; max-width:760px; text-align:center; box-shadow:0 4px 12px #0003; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on { opacity:1; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; background:linear-gradient(#7cc4f5,#bfe6ff 55%,#7cc46a 55%); }
  #start h1 { margin:0; font-size:64px; color:#fff; text-shadow:0 4px 0 #2f7fd1; }
  #start .row { display:flex; gap:24px; }
  #start .big { width:300px; padding:22px 10px; border-radius:22px; font-size:30px; font-weight:600; color:#fff; box-shadow:0 5px 0 #0003; }
  #start .big small { display:block; font-size:17px; font-weight:400; margin-top:6px; }
  #b-treffer { background:#e0413a; }
  #b-bauen { background:#2f7fd1; }
  #start p { margin:0; font-size:16px; color:#24324a; background:#ffffffcc; padding:6px 14px; border-radius:10px; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="top" class="hide">
    <button id="home">⌂ Zum Start</button>
    <div id="banner"></div>
    <span id="stars">★ 0</span>
    <button id="help" title="Hilfe (H)">?</button>
  </div>
  <div id="bottom" class="hide">
    <div id="digits"></div>
    <button id="done">Fertig</button>
  </div>
  <div id="toast"></div>
  <div id="start">
    <h1>Mathe-Flieger</h1>
    <div class="row">
      <button class="big" id="b-treffer">Treffer<small>Bomben auf die richtige Form</small></button>
      <button class="big" id="b-bauen">Bauen und Malen<small>Kisten abwerfen, Ansichten malen</small></button>
    </div>
    <p>Prototyp zum Ausprobieren. Nichts wird gespeichert.</p>
  </div>
</div>
<script>
'use strict';
const W = 1024, H = 700;
const cv = document.getElementById('cv');
cv.width = W * 2; cv.height = H * 2;
const ctx = cv.getContext('2d');
ctx.scale(2, 2);
const $ = (id) => document.getElementById(id);

function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const st = $('stage');
  st.style.transform = `scale(${k})`;
  st.style.left = (innerWidth - W * k) / 2 + 'px';
  st.style.top = (innerHeight - H * k) / 2 + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- helpers ---------- */
const PAL = ['#e0413a', '#2f7fd1', '#f2c230', '#3fa34d', '#ef7d22'];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f))));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function poly(pts, fill, stroke = 'rgba(0,0,0,.35)', lw = 1.3) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(t, x, y, size, color = '#24324a', align = 'center', weight = 600) {
  ctx.font = `${weight} ${size}px Fredoka, 'Trebuchet MS', sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y);
}
const eq2 = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/* ---------- sound (synthesized) ---------- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, dur, type = 'sine', vol = 0.2, f2 = null, delay = 0) {
  const a = ac(); if (!a) return; const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 800, delay = 0) {
  const a = ac(); if (!a) return; const t = a.currentTime + delay;
  const b = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate); const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(); s.buffer = b; const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq;
  const g = a.createGain(); g.gain.value = vol; s.connect(fl).connect(g).connect(a.destination); s.start(t);
}
const SND = {
  whoosh() { noise(0.6, 0.12, 900); },
  drop() { tone(900, 0.5, 'sine', 0.08, 300); },
  boom() { tone(150, 0.5, 'sine', 0.35, 40); noise(0.45, 0.3, 700); [784, 988, 1175].forEach((f, i) => tone(f, 0.2, 'triangle', 0.1, null, 0.15 + i * 0.07)); },
  puff() { noise(0.3, 0.12, 500); },
  pop() { tone(520, 0.12, 'triangle', 0.18, 880); },
  thud() { tone(220, 0.12, 'square', 0.06, 110); },
  splat() { noise(0.12, 0.12, 2400); tone(660, 0.08, 'sine', 0.06); },
  cheer() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.16, null, i * 0.09)); },
  soft() { tone(392, 0.22, 'sine', 0.12); tone(330, 0.3, 'sine', 0.12, null, 0.18); },
};

/* ---------- particles ---------- */
let parts = [];
function burst(x, y, n, colors, kind = 'star', speed = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * speed;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (kind === 'smoke' ? 20 : 140), life: 0.8 + Math.random() * 0.7, age: 0, c: colors[i % colors.length], kind, r: kind === 'smoke' ? 10 + Math.random() * 8 : 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10 });
  }
}
function drawStar(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const rad = i % 2 ? r * 0.45 : r; const a = rot + (i * Math.PI) / 5; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fill();
}
function updParts(dt) {
  for (const p of parts) {
    p.age += dt;
    if (p.kind === 'smoke' || p.kind === 'trail') { p.vx *= 0.96; p.vy *= 0.96; p.r += dt * 14; }
    else p.vy += 420 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  parts = parts.filter((p) => p.age < p.life);
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, 1 - p.age / p.life); ctx.fillStyle = p.c;
    if (p.kind === 'star') drawStar(p.x, p.y, p.r, p.rot);
    else if (p.kind === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r / 2.5, p.r * 2, p.r / 1.2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
const CELEB = ['#ffd23f', '#ff8fb1', '#7ee0ff', '#9be27a', '#ffffff'];

/* ---------- isometric drawing ---------- */
function isoP(ox, oy, s) { return (a, b, c) => [ox + (a - b) * s, oy + (a + b) * s * 0.5 - c * s * 1.1]; }
function drawBox(P, x, y, z, dx, dy, dz, col, alpha = 1) {
  ctx.globalAlpha = alpha;
  poly([P(x, y, z + dz), P(x + dx, y, z + dz), P(x + dx, y + dy, z + dz), P(x, y + dy, z + dz)], shade(col, 1.25));
  poly([P(x + dx, y, z + dz), P(x + dx, y + dy, z + dz), P(x + dx, y + dy, z), P(x + dx, y, z)], shade(col, 0.72));
  poly([P(x, y + dy, z + dz), P(x + dx, y + dy, z + dz), P(x + dx, y + dy, z), P(x, y + dy, z)], col);
  ctx.globalAlpha = 1;
}
// building origin so that its ground center sits at (cx, cy)
function bOrigin(h, cx, cy, s) { const n = h.length, m = h[0].length; return isoP(cx - ((m - n) / 2) * s, cy - ((m + n) / 4) * s, s); }
function drawBuilding(h, cx, cy, s, col, opt = {}) {
  const n = h.length, m = h[0].length, P = bOrigin(h, cx, cy, s);
  if (opt.tiles) {
    for (let y = 0; y < n; y++) for (let x = 0; x < m; x++) {
      const sel = opt.sel && opt.sel.x === x && opt.sel.y === y;
      const wrong = opt.wrong && opt.wrong.has(x + ',' + y);
      poly([P(x, y, 0), P(x + 1, y, 0), P(x + 1, y + 1, 0), P(x, y + 1, 0)], sel ? 'rgba(255,230,120,.85)' : wrong ? 'rgba(255,170,80,.6)' : 'rgba(255,255,255,.28)', 'rgba(255,255,255,.7)', 1.5);
    }
  } else {
    // soft shadow
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    const c = P(m / 2, n / 2, 0); ctx.beginPath(); ctx.ellipse(c[0], c[1] + 2, (m + n) * s * 0.55, (m + n) * s * 0.28, 0, 0, Math.PI * 2); ctx.fill();
  }
  for (let d = 0; d <= m + n - 2; d++) for (let y = 0; y < n; y++) {
    const x = d - y; if (x < 0 || x >= m) continue;
    for (let z = 0; z < h[y][x]; z++) drawBox(P, x, y, z, 1, 1, 1, Array.isArray(col) ? col[(x + y + z) % col.length] : col);
    if (opt.crates) for (const c of opt.crates) if (c.x === x && c.y === y && c.delay <= 0) drawCrate(P, c);
  }
  return P;
}
function drawCrate(P, c) {
  drawBox(P, c.x + 0.05, c.y + 0.05, c.z, 0.9, 0.9, 0.9, '#c98a3c');
  // planks
  const a = P(c.x + 0.05, c.y + 0.95, c.z + 0.45), b = P(c.x + 0.95, c.y + 0.95, c.z + 0.45);
  ctx.strokeStyle = 'rgba(90,50,10,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  if (c.z > c.tz + 0.25) { // parachute
    const top = P(c.x + 0.5, c.y + 0.5, c.z + 0.9), ch = P(c.x + 0.5, c.y + 0.5, c.z + 2.4);
    const r = 34;
    ctx.strokeStyle = 'rgba(60,60,60,.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(top[0] - 14, top[1]); ctx.lineTo(ch[0] - r, ch[1]); ctx.moveTo(top[0] + 14, top[1]); ctx.lineTo(ch[0] + r, ch[1]); ctx.stroke();
    ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(ch[0], ch[1], r, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(ch[0], ch[1]); ctx.arc(ch[0], ch[1], r, Math.PI * 1.33, Math.PI * 1.66); ctx.fill();
  }
}

/* ---------- solids and flat shapes ---------- */
const SOLIDS = [
  { k: 'wuerfel', acc: 'den Würfel', nom: 'der Würfel', hint: 'Der Würfel hat 6 gleich große Quadrate als Flächen.' },
  { k: 'quader', acc: 'den Quader', nom: 'der Quader', hint: 'Der Quader ist lang wie ein Ziegelstein.' },
  { k: 'zylinder', acc: 'den Zylinder', nom: 'der Zylinder', hint: 'Der Zylinder ist rund wie eine Dose. Oben hat er einen Kreis.' },
  { k: 'kugel', acc: 'die Kugel', nom: 'die Kugel', hint: 'Die Kugel ist ganz rund wie ein Ball.' },
  { k: 'pyramide', acc: 'die Pyramide', nom: 'die Pyramide', hint: 'Die Pyramide hat oben eine Spitze und Dreiecke an den Seiten.' },
];
const FLATS = [
  { k: 'kreis', acc: 'den Kreis', nom: 'der Kreis', hint: 'Der Kreis ist rund und hat keine Ecken.' },
  { k: 'dreieck', acc: 'das Dreieck', nom: 'das Dreieck', hint: 'Das Dreieck hat 3 Ecken und 3 Seiten.' },
  { k: 'quadrat', acc: 'das Quadrat', nom: 'das Quadrat', hint: 'Das Quadrat hat 4 gleich lange Seiten.' },
  { k: 'rechteck', acc: 'das Rechteck', nom: 'das Rechteck', hint: 'Das Rechteck hat 2 lange und 2 kurze Seiten.' },
];
function shadow(x, y, rx, ry) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function drawSolid(k, cx, cy, col) {
  shadow(cx, cy + 4, 46, 17);
  if (k === 'wuerfel') { drawBox(isoP(cx, cy, 36), -0.5, -0.5, 0, 1, 1, 1, col); }
  else if (k === 'quader') { drawBox(isoP(cx, cy, 30), -1, -0.5, 0, 2, 1, 0.85, col); }
  else if (k === 'zylinder') {
    const rx = 31, ry = 15, h = 62;
    const g = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0); g.addColorStop(0, shade(col, 0.75)); g.addColorStop(0.4, shade(col, 1.1)); g.addColorStop(1, shade(col, 0.6));
    ctx.beginPath(); ctx.moveTo(cx - rx, cy - h); ctx.lineTo(cx - rx, cy); ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0, true); ctx.lineTo(cx + rx, cy - h); ctx.closePath();
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy - h, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = shade(col, 1.25); ctx.fill(); ctx.stroke();
  } else if (k === 'kugel') {
    const g = ctx.createRadialGradient(cx - 10, cy - 44, 4, cx, cy - 32, 34); g.addColorStop(0, shade(col, 1.5)); g.addColorStop(1, shade(col, 0.7));
    ctx.beginPath(); ctx.arc(cx, cy - 32, 33, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1.3; ctx.stroke();
  } else if (k === 'pyramide') {
    const P = isoP(cx, cy, 40), ap = P(0, 0, 1.6);
    poly([P(-0.5, 0.5, 0), P(0.5, 0.5, 0), ap], col);
    poly([P(0.5, -0.5, 0), P(0.5, 0.5, 0), ap], shade(col, 0.72));
  }
}
function drawFlat(k, cx, cy, col) {
  ctx.save(); ctx.translate(cx, cy); // seen from the plane: straight from above, so a square stays a square
  const path = () => {
    ctx.beginPath();
    if (k === 'kreis') ctx.arc(0, 0, 34, 0, Math.PI * 2);
    else if (k === 'quadrat') ctx.rect(-30, -30, 60, 60);
    else if (k === 'rechteck') ctx.rect(-46, -22, 92, 44);
    else if (k === 'dreieck') { ctx.moveTo(-6, -42); ctx.lineTo(38, 30); ctx.lineTo(-40, 26); ctx.closePath(); }
  };
  ctx.translate(3, 3); path(); ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fill(); ctx.translate(-3, -3);
  path(); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = shade(col, 0.6); ctx.stroke();
  ctx.restore();
}

/* ---------- plan grids ---------- */
function drawPlan(plan, x0, y0, c, opt = {}) {
  const n = plan.length, m = plan[0].length;
  for (let y = 0; y < n; y++) for (let x = 0; x < m; x++) {
    const X = x0 + x * c, Y = y0 + y * c;
    const sel = opt.sel && opt.sel.x === x && opt.sel.y === y;
    ctx.fillStyle = sel ? '#fff3b0' : '#fff'; ctx.fillRect(X, Y, c, c);
    ctx.strokeStyle = '#24324a'; ctx.lineWidth = 2; ctx.strokeRect(X, Y, c, c);
    const v = plan[y][x];
    if (v !== null && v !== undefined) text(String(v), X + c / 2, Y + c / 2 + 2, c * 0.55);
    else if (opt.ghost && opt.ghost[y] && opt.ghost[y][x] != null) text(String(opt.ghost[y][x]), X + c / 2, Y + c / 2 + 2, c * 0.55, 'rgba(36,50,74,.3)');
    if (opt.ghostWrong && opt.ghostWrong.x === x && opt.ghostWrong.y === y) text(String(opt.ghostWrong.v), X + c - 10, Y + 12, 15, '#2f7fd1');
    if (opt.wrong && opt.wrong.has(x + ',' + y)) { ctx.setLineDash([6, 4]); ctx.strokeStyle = '#ef7d22'; ctx.lineWidth = 4; ctx.strokeRect(X + 4, Y + 4, c - 8, c - 8); ctx.setLineDash([]); }
  }
  text('vorn', x0 + (m * c) / 2, y0 + n * c + 16, 16);
}
function card(x, y, w, h, title) {
  ctx.fillStyle = 'rgba(255,255,255,.92)'; rr(x, y, w, h, 16); ctx.fill();
  text(title, x + w / 2, y + 20, 18);
}

/* ---------- plane ---------- */
const plane = { x: -160, y: 92, speed: 150, pass: null, smoke: null, t: 0 };
function startPass(pass) { plane.x = -140; plane.speed = 560; plane.pass = pass; SND.whoosh(); }
function updPlane(dt) {
  plane.t += dt; plane.x += plane.speed * dt;
  const p = plane.pass;
  if (p && p.releaseX != null && !p.released && plane.x >= p.releaseX) { p.released = true; p.onRelease(); }
  if (plane.smoke && Math.random() < 0.9) parts.push({ x: plane.x - 46, y: plane.y + 6 + bob(), vx: -40, vy: (Math.random() - 0.5) * 20, life: 1.6, age: 0, c: plane.smoke, kind: 'trail', r: 8, rot: 0, vr: 0 });
  if (plane.x > W + 170) { if (p && p.onEnd) p.onEnd(); plane.pass = null; plane.smoke = null; plane.speed = 150; plane.x = -170; }
}
const bob = () => Math.sin(plane.t * 2.2) * 4;
function drawPlane() {
  const x = plane.x, y = plane.y + bob();
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(plane.t * 2.2 + 1) * 0.03);
  // tail
  poly([[-48, -4], [-60, -30], [-44, -30], [-30, -6]], '#c4312b', 'rgba(0,0,0,.3)');
  // back wing
  poly([[-6, -2], [16, -16], [26, -16], [12, 0]], '#9e2621', null);
  // body
  ctx.beginPath(); ctx.ellipse(0, 0, 52, 15, 0, 0, Math.PI * 2); ctx.fillStyle = '#e0413a'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.fillStyle = '#ffffff55'; ctx.beginPath(); ctx.ellipse(-4, -6, 38, 4, 0, 0, Math.PI * 2); ctx.fill();
  // cockpit and pilot
  ctx.beginPath(); ctx.ellipse(14, -12, 14, 10, 0, Math.PI, 0); ctx.fillStyle = '#bfe8ff'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(14, -14, 6, 0, Math.PI * 2); ctx.fillStyle = '#f5c99b'; ctx.fill();
  ctx.fillStyle = '#7a4a1e'; ctx.fillRect(8, -21, 12, 4);
  // front wing

/* ---------- building generator for Bauen und Malen ---------- */
function genBuilding(n) {
  for (;;) {
    const h = randPlan(n, n === 2 ? 1 : 0, 3);
    let ok = h.flat().filter((v) => v > 0).length >= (n === 2 ? 4 : 5) && Math.max(...h.flat()) >= 2;
    // keep every stack readable: a stack must be at least as tall as the stack diagonally in front of it
    for (let y = 0; y < n - 1; y++) for (let x = 0; x < n - 1; x++) if (h[y][x] < h[y + 1][x + 1]) ok = false;
    if (ok) return h;
  }
}

/* ---------- mode: Bauen (fill in the building plan, crates drop) ---------- */
const FIELD = { cx: 560, cy: 420, s: 50 };

/* ---------- mode: Malen (color a view) ---------- */

function help() {

    } else { T.ghost = T.target; say('Hier ist der ganze Bauplan.'); }
  } else if (S.mode === 'malen') {
    const hints = { vorn: 'Stell dir vor, du stehst vorn. In jeder Spalte siehst du nur den höchsten Turm.', rechts: 'Geh in Gedanken nach rechts. Vorn ist jetzt links von dir.', links: 'Geh in Gedanken nach links. Vorn ist jetzt rechts von dir.', oben: 'Du fliegst darüber. Jeder Turm ist von oben ein Quadrat, egal wie hoch.' };
    if (S.help === 1) say(hints[T.view], 4200); else { T.ghost = true; say('So sieht es aus. Male es nach.'); }
  }
}

/* ---------- input ---------- */
function pos(e) { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H]; }
function itemAt(x, y) { const T = S.T; let best = -1, bd = 1e9; T.items.forEach((it, i) => { if (it.gone) return; const [hx, hy, hr] = itemHit(it); const d = Math.hypot(x - hx, y - hy); if (d < hr && d < bd) { bd = d; best = i; } }); return best; }
cv.addEventListener('pointermove', (e) => { if (S.mode !== 'treffer') return; S.kbd = false; const [x, y] = pos(e); S.hover = itemAt(x, y); });
cv.addEventListener('pointerdown', (e) => {
  ac(); S.kbd = false; const [x, y] = pos(e);
  if (S.mode === 'treffer') { const i = itemAt(x, y); if (i >= 0) dropOn(i); }
  else if (S.mode === 'bauen') {
    const T = S.T, { x0, y0, c } = planBox();
    const px = Math.floor((x - x0) / c), py = Math.floor((y - y0) / c);
    if (px >= 0 && py >= 0 && px < T.n && py < T.n) { T.sel = { x: px, y: py }; return; }
    // a tile on the field
    const P0 = bOrigin(T.built, FIELD.cx, FIELD.cy, FIELD.s), o = P0(0, 0, 0), s = FIELD.s;
    const u = (x - o[0]) / s, v = (y - o[1]) / (s * 0.5), a = Math.floor((u + v) / 2), b = Math.floor((v - u) / 2);
    if (a >= 0 && b >= 0 && a < T.n && b < T.n) T.sel = { x: a, y: b };
  } else if (S.mode === 'malen') {
    const T = S.T, { x0, y0, c } = paintBox();
    const k = Math.floor((x - x0) / c), r = Math.floor((y - y0) / c);
    if (r >= 0 && k >= 0 && r < T.exp.length && k < T.exp[0].length) toggleCell(r, k);
  }
});
addEventListener('keydown', (e) => {
  if (S.mode === 'start') { if (e.key === 'Enter') $('b-treffer').click(); return; }
  ac(); S.kbd = true;
  if (e.key === 'Escape') return goStart();
  if (e.key === 'h' || e.key === 'H') return help();
  const T = S.T, dx = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0, dy = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
  if (S.mode === 'treffer') {
    const live = T.items.map((it, i) => i).filter((i) => !T.items[i].gone).sort((a, b) => T.items[a].x - T.items[b].x);
    if (dx || dy) { e.preventDefault(); const k = live.indexOf(S.hover); S.hover = live[(k + (dx || dy) + live.length) % live.length] ?? live[0]; }
    if ((e.key === 'Enter' || e.key === ' ') && S.hover >= 0) { e.preventDefault(); dropOn(S.hover); }
  } else if (S.mode === 'bauen') {
    if (dx || dy) { e.preventDefault(); T.sel = { x: (T.sel.x + dx + T.n) % T.n, y: (T.sel.y + dy + T.n) % T.n }; }
    if (/^[0-4]$/.test(e.key)) digit(+e.key);
    if (e.key === 'Enter') doneBauen();
  } else if (S.mode === 'malen') {
    const rows = T.exp.length, cols = T.exp[0].length;
    if (dx || dy) { e.preventDefault(); T.cur = { r: (T.cur.r + dy + rows) % rows, c: (T.cur.c + dx + cols) % cols }; }
    if (e.key === ' ') { e.preventDefault(); toggleCell(T.cur.r, T.cur.c); }
    if (e.key === 'Enter') doneMalen();
  }
});

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.clearRect(0, 0, W, H);
  drawBg(dt);
  if (S.mode !== 'start') {
    updPlane(dt); updBombs(dt); updCrates(dt); updParts(dt);
    if (S.mode === 'treffer') drawTreffer();
    else if (S.mode === 'bauen') drawBauen();
    else if (S.mode === 'malen') drawMalen();
    drawParts();
    drawPlane();
  }
  requestAnimationFrame(frame);
}
ui('start');
requestAnimationFrame(frame);
</script>
</body>
