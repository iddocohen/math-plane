<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Mathe-Flieger icon: the red plane with its pilot on sky blue, drawn by hand for this game. -->
  <rect width="512" height="512" rx="96" fill="#7ec8f0"/>
  <ellipse cx="150" cy="140" rx="70" ry="26" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="390" cy="410" rx="80" ry="28" fill="#ffffff" opacity="0.85"/>
  <!-- tail fin -->
  <path d="M96 196 L148 196 L176 262 L104 262 Z" fill="#c62828"/>
  <!-- back wing -->
  <path d="M206 300 L282 300 L246 360 L190 360 Z" fill="#b71c1c"/>
  <!-- body -->
  <path d="M100 250 C150 228 300 220 372 232 C420 240 440 262 440 280 C440 300 420 318 372 322 C290 330 150 318 104 292 Z" fill="#e53935"/>
  <!-- cockpit and pilot -->
  <circle cx="300" cy="222" r="26" fill="#f2c9a0"/>
  <path d="M272 214 C276 190 324 190 328 214 Z" fill="#6d4c41"/>
  <path d="M262 236 C266 206 334 206 340 236 Z" fill="#bfe6f7" opacity="0.7"/>
  <!-- front wing -->
  <path d="M236 270 L326 270 L282 336 L214 336 Z" fill="#c62828"/>
  <!-- stripe -->
  <path d="M150 262 L370 262" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- propeller -->
  <rect x="436" y="270" width="16" height="20" rx="6" fill="#455a64"/>
  <ellipse cx="456" cy="280" rx="8" ry="58" fill="#37474f" opacity="0.8"/>
  <!-- wheel -->
  <line x1="300" y1="320" x2="300" y2="350" stroke="#455a64" stroke-width="8"/>
  <circle cx="300" cy="360" r="16" fill="#37474f"/>
</svg>
